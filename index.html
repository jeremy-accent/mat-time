<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mat Time">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C96342">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mat Time</title>
<style>
  :root {
    --bg: #F4F2EC;
    --panel: #FAF9F4;
    --panel-2: #F0EEE5;
    --ink: #1F1E1D;
    --ink-soft: #3D3B38;
    --muted: #8A8780;
    --border: #E5E2D9;
    --border-soft: #EFEDE5;
    --coral: #C96342;
    --coral-hover: #B5563A;
    --coral-soft: #F4DBD2;
    --rest:  #DEE3D7;
    --shadow-sm: 0 1px 2px rgba(75, 60, 40, 0.05);
    --shadow-md: 0 4px 14px rgba(75, 60, 40, 0.07);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-y: contain;
  }
  body { user-select: none; -webkit-user-select: none; }
  input, textarea { user-select: text; -webkit-user-select: text; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: transparent; border: 0; padding: 0; }

  .serif { font-family: Georgia, "Iowan Old Style", serif; }

  main {
    max-width: 560px; margin: 0 auto;
    padding: calc(14px + var(--safe-top)) 14px calc(28px + var(--safe-bot));
  }

  /* ---------- Header ---------- */
  .app-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .app-title {
    font-family: Georgia, serif; font-size: 22px; margin: 0;
    letter-spacing: -0.01em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .audio-controls {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted);
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 260px;
  }
  .audio-controls svg { width: 18px; height: 18px; pointer-events: none; }
  .audio-controls input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 80px; height: 4px;
    background: var(--border); border-radius: 2px;
    margin: 0;
  }
  .audio-controls input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--coral); cursor: pointer;
  }
  .audio-controls input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; border: 0;
    background: var(--coral); cursor: pointer;
  }
  .sound-select {
    font: inherit; font-size: 12px;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    max-width: 140px;
  }
  .sound-select:active { background: var(--panel-2); }
  .test-buzz-btn {
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 10px;
    color: var(--muted);
    transition: background 100ms ease, color 100ms ease, transform 80ms ease;
  }
  .test-buzz-btn:active { background: var(--panel-2); color: var(--coral); transform: scale(0.93); }
  .test-buzz-btn.flash { background: var(--coral-soft); color: var(--coral); }

  /* Diagnostic readout (shows after first test-buzz tap) */
  .diag {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin: 0 0 14px;
    line-height: 1.5;
    word-break: break-word;
  }
  .diag.hidden { display: none; }
  .diag .row { display: flex; justify-content: space-between; gap: 8px; }
  .diag .ok { color: #4a7a3a; }
  .diag .bad { color: var(--coral); }

  /* ---------- Timer card (sticky) ---------- */
  .timer {
    position: sticky; top: calc(var(--safe-top) + 4px); z-index: 10;
    background: var(--panel);
    border: 1px solid var(--border); border-radius: 18px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow-md);
    margin-bottom: 18px;
    text-align: center;
    transition: padding 180ms ease;
  }
  /* Minimized: a single thin row [countdown] [segname] [controls] */
  .timer.minimized {
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
  }
  .timer.minimized .timer-label,
  .timer.minimized .next-up,
  .timer.minimized .totals,
  .timer.minimized .toggle-row { display: none; }
  .timer.minimized .countdown {
    font-size: 28px; line-height: 1;
    margin: 0;
    order: 1;
    flex-shrink: 0;
    letter-spacing: -0.01em;
  }
  .timer.minimized .timer-segname {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13px; margin: 0;
    color: var(--ink-soft);
    order: 2; flex: 1; min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  .timer.minimized .controls {
    order: 3;
    gap: 6px;
    margin: 0;
    flex-shrink: 0;
  }
  .timer.minimized .ctrl-btn  { width: 32px; height: 32px; }
  .timer.minimized .ctrl-btn svg { width: 14px; height: 14px; }
  .timer.minimized .ctrl-play { width: 40px; height: 40px; }
  .timer.minimized .ctrl-play svg { width: 18px; height: 18px; }
  .timer.finished { background: var(--coral-soft); border-color: var(--coral); }
  .timer-label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 2px;
  }
  .timer-segname {
    font-family: Georgia, serif; font-size: 19px;
    margin: 0 0 12px; min-height: 1.2em; line-height: 1.2;
    color: var(--ink);
  }
  .countdown {
    font-variant-numeric: tabular-nums; font-feature-settings: "tnum";
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 72px; line-height: 1; font-weight: 300;
    margin: 4px 0 16px;
    letter-spacing: -0.02em;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  .controls {
    display: flex; justify-content: center; align-items: center; gap: 12px;
    margin-bottom: 10px;
  }
  .ctrl-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--panel-2);
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 80ms ease, background 80ms ease;
    color: var(--ink-soft);
  }
  .ctrl-btn:active { transform: scale(0.93); background: var(--border-soft); }
  .ctrl-btn svg { width: 22px; height: 22px; }
  .ctrl-play {
    width: 72px; height: 72px;
    background: var(--coral); color: white;
  }
  .ctrl-play:active { background: var(--coral-hover); }
  .ctrl-play svg { width: 28px; height: 28px; }
  .next-up {
    font-size: 13px; color: var(--muted); margin-top: 6px;
    min-height: 1.4em;
  }
  .next-up strong { color: var(--ink-soft); font-weight: 500; }
  .totals { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* Toggle pill row — sits below the controls in the timer card */
  .toggle-row {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    margin-top: 8px;
  }
  .pill-toggle {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 8px;
    border-radius: 999px;
    background: var(--panel-2);
    font-size: 12px; color: var(--ink-soft);
    transition: background 100ms ease, color 100ms ease, border-color 100ms ease;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .pill-toggle:active { background: var(--border-soft); }
  .pill-toggle .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #C2CBB6;  /* neutral when off */
    transition: background 100ms ease;
  }
  /* Auto-advance: ON = green (default behaviour), OFF = coral (manual mode) */
  .pill-toggle.advance-toggle[data-on="true"] .dot { background: #7A9670; }
  .pill-toggle.advance-toggle[data-on="false"] {
    background: var(--coral-soft); border-color: var(--coral); color: var(--coral);
  }
  .pill-toggle.advance-toggle[data-on="false"] .dot { background: var(--coral); }
  /* Buffer toggle: ON = coral filled (active break inserts), OFF = neutral */
  .pill-toggle.buffer-toggle[data-on="true"] {
    background: var(--coral-soft); border-color: var(--coral); color: var(--coral);
  }
  .pill-toggle.buffer-toggle[data-on="true"] .dot { background: var(--coral); }

  /* In-buffer timer-card state (during the 10s break between segments) */
  .timer.in-buffer {
    background: var(--coral-soft);
    border-color: var(--coral);
  }
  .timer.in-buffer .timer-label { color: var(--coral); }
  .timer.in-buffer .timer-segname { color: var(--ink); }

  /* ---------- Editor ---------- */
  .editor-head {
    display: flex; justify-content: space-between; align-items: center;
    margin: 8px 4px 6px;
  }
  .editor-head h2 {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;
    margin: 0; font-weight: 600;
  }
  .editor-head .plan-total {
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  .seg-list { list-style: none; padding: 0; margin: 0 0 8px; }
  .seg-row {
    display: grid;
    grid-template-columns: 28px 1fr 60px 30px 30px;
    align-items: center; gap: 5px;
    padding: 8px 10px;
    margin-bottom: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    position: relative;
    touch-action: pan-y;
    transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
  }
  .seg-row.current {
    background: var(--coral-soft);
    border-color: var(--coral);
  }
  .seg-row.completed { opacity: 0.45; }
  .seg-row.dragging {
    opacity: 0.4;
    z-index: 1;
  }
  .seg-row.drag-clone {
    position: fixed; z-index: 999; pointer-events: none;
    box-shadow: 0 8px 24px rgba(75, 60, 40, 0.18);
    opacity: 0.95; margin: 0;
    background: var(--panel);
  }
  .seg-handle {
    cursor: grab; touch-action: none;
    color: var(--muted); user-select: none;
    display: flex; align-items: center; justify-content: center;
    height: 32px; width: 28px;
    font-size: 20px; line-height: 1;
  }
  .seg-handle:active { cursor: grabbing; }
  .seg-name-input {
    border: 0; background: transparent; outline: 0;
    padding: 6px 4px; min-width: 0; width: 100%;
    font-size: 15px; color: var(--ink);
    border-radius: 6px;
  }
  .seg-name-input:focus { background: var(--bg); }
  .seg-duration-input {
    border: 0; background: var(--panel-2);
    padding: 6px 6px; border-radius: 6px;
    text-align: center; width: 100%;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    outline: 0;
    color: var(--ink);
  }
  .seg-duration-input:focus { background: var(--bg); box-shadow: inset 0 0 0 1px var(--coral); }
  .seg-delete, .seg-dup {
    width: 30px; height: 30px; border-radius: 50%;
    color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 80ms ease, color 80ms ease;
  }
  .seg-delete { font-size: 18px; }
  .seg-delete:active { background: var(--panel-2); color: var(--coral); }
  .seg-dup svg { width: 14px; height: 14px; }
  .seg-dup:active { background: var(--panel-2); color: var(--ink); }

  /* Tap empty space on a row to jump timer there */
  .seg-jump-area {
    position: absolute; left: 32px; right: 100px; top: 0; bottom: 0;
    cursor: pointer;
  }

  .add-btn {
    display: block; width: 100%;
    padding: 12px; margin: 4px 0 10px;
    text-align: center; font-size: 14px; color: var(--muted);
    background: transparent;
    border: 1px dashed var(--border); border-radius: 12px;
  }
  .add-btn:active { background: var(--panel); color: var(--ink-soft); }
  .add-btn-top { margin: 0 0 8px; }

  .footer-actions {
    display: flex; gap: 8px; justify-content: center;
    margin: 18px 0 0;
  }
  .text-btn {
    font-size: 13px; color: var(--muted);
    padding: 8px 14px; border-radius: 8px;
  }
  .text-btn:active { background: var(--panel); color: var(--ink); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    bottom: calc(20px + var(--safe-bot));
    left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 24px;
    display: flex; align-items: center; gap: 14px;
    font-size: 14px;
    box-shadow: var(--shadow-md);
    z-index: 100;
    max-width: calc(100% - 40px);
  }
  .toast button {
    background: transparent; border: 0; color: var(--coral-soft);
    font-weight: 600; padding: 4px 6px;
  }
  .toast.hidden { display: none; }

  /* Subtle "rest" hint for segments named "Rest" */
  .seg-row[data-rest="true"] { background: var(--rest); border-color: #C2CBB6; }
  .seg-row[data-rest="true"].current { background: var(--coral-soft); border-color: var(--coral); }

  /* Disable double-tap zoom on controls */
  .ctrl-btn, .seg-handle, .seg-delete, .add-btn, .text-btn { touch-action: manipulation; }

  /* Slightly different on desktop */
  @media (min-width: 600px) {
    .countdown { font-size: 84px; }
  }
</style>
</head>
<body>

<main>
  <header class="app-header">
    <h1 class="app-title">Mat Time</h1>
    <div class="audio-controls">
      <button type="button" id="testBuzzBtn" class="test-buzz-btn" aria-label="Test buzzer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
      <input id="volSlider" type="range" min="0" max="100" step="1" value="80" aria-label="Volume">
      <select id="soundSelect" class="sound-select" aria-label="Buzzer sound">
        <option value="scoreboard">Scoreboard buzzer</option>
        <option value="bell">Boxing bell</option>
        <option value="airhorn">Air horn</option>
        <option value="whistle">Whistle</option>
        <option value="beep">Single beep</option>
        <option value="triple">Triple beep</option>
      </select>
    </div>
  </header>

  <!-- Diagnostic readout — hidden until first buzzer test -->
  <div class="diag hidden" id="diag"></div>

  <!-- ===== TIMER ===== -->
  <section class="timer" id="timerCard" aria-live="polite">
    <div class="timer-label" id="timerLabel">Now</div>
    <div class="timer-segname serif" id="curName">—</div>
    <div class="countdown" id="countdown">00:00</div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="Previous segment">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn ctrl-play" id="playBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" aria-label="Next segment">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
    <div class="next-up" id="nextUp">&nbsp;</div>
    <div class="totals" id="totals">0:00 / 0:00</div>
    <div class="toggle-row">
      <button type="button" class="pill-toggle advance-toggle" id="advanceToggle" data-on="true" aria-label="Toggle auto-advance">
        <span class="dot" aria-hidden="true"></span>
        <span class="label" id="advanceLabel">Auto-advance</span>
      </button>
      <button type="button" class="pill-toggle buffer-toggle" id="bufferToggle" data-on="false" aria-label="Toggle inter-segment break">
        <span class="dot" aria-hidden="true"></span>
        <span class="label" id="bufferLabel">+10s break</span>
      </button>
    </div>
  </section>

  <!-- ===== EDITOR ===== -->
  <section>
    <div class="editor-head">
      <h2>Plan</h2>
      <span class="plan-total" id="planTotal">0:00</span>
    </div>
    <button class="add-btn add-btn-top" id="addTopBtn">+ Add to top</button>
    <ol class="seg-list" id="segList"></ol>
    <button class="add-btn" id="addBtn">+ Add to bottom</button>
    <div class="footer-actions">
      <button class="text-btn" id="resetBtn">Reset to default plan</button>
    </div>
  </section>
</main>

<!-- Toast -->
<div class="toast hidden" id="toast" role="status">
  <span id="toastMsg">Deleted</span>
  <button id="toastUndo">Undo</button>
</div>

<script>
/* ============================================================================
   Mat Time — single-file BJJ class planner / timer
   ============================================================================ */

// ---------- DEFAULT PLAN ----------
// The 90-min closed-guard passing class we designed.
const DEFAULT_PLAN = {
  version: 1,
  segments: [
    { name: "Warm ups",                                   seconds: 12 * 60 },
    { name: "Water break",                                seconds:  1 * 60 },
    { name: "Technique demo 1",                           seconds:  5 * 60 },
    { name: "Technique drills 1",                         seconds:  8 * 60 },
    { name: "Technique demo 2",                           seconds:  5 * 60 },
    { name: "Technique drills 2",                         seconds:  8 * 60 },
    { name: "Q&A",                                        seconds:  3 * 60 },
    { name: "Game 1 — Stand up or stay down",             seconds:  7 * 60 },
    { name: "Game 2 — Open and pass / sweep & entangle",  seconds:  7 * 60 },
    { name: "Water break",                                seconds:  1 * 60 },
    { name: "Situational sparring",                       seconds:  4 * 60 },
    { name: "Final Q&A",                                  seconds:  3 * 60 },
    { name: "Sparring round 1",                           seconds:  5 * 60 },
    { name: "Rest",                                       seconds:  2 * 60 },
    { name: "Sparring round 2",                           seconds:  5 * 60 },
    { name: "Rest",                                       seconds:  2 * 60 },
    { name: "Sparring round 3",                           seconds:  5 * 60 },
    { name: "Rest",                                       seconds:  2 * 60 },
    { name: "Sparring round 4",                           seconds:  5 * 60 },
  ],
  volume: 0.8,
};

const STORAGE_KEY = 'mat-time:v1';

// ---------- STATE ----------
const state = (() => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.segments) && parsed.segments.length) {
        return {
          segments: parsed.segments.map(s => ({
            id: s.id || crypto.randomUUID(),
            name: String(s.name || 'Segment'),
            seconds: Math.max(1, Math.min(3 * 60 * 60, parseInt(s.seconds, 10) || 60)),
          })),
          volume: typeof parsed.volume === 'number' ? parsed.volume : 0.8,
          autoAdvance: parsed.autoAdvance !== false,
          // Validated lazily against BuzzerSounds in start()/changeSound()
          buzzerSound: (typeof parsed.buzzerSound === 'string' && parsed.buzzerSound) || 'scoreboard',
          bufferEnabled: parsed.bufferEnabled === true,
          bufferSeconds: typeof parsed.bufferSeconds === 'number' && parsed.bufferSeconds > 0
            ? Math.min(120, Math.round(parsed.bufferSeconds)) : 10,
        };
      }
    }
  } catch (_) {}
  return cloneDefault();
})();

function cloneDefault() {
  return {
    segments: DEFAULT_PLAN.segments.map(s => ({
      id: crypto.randomUUID(),
      name: s.name,
      seconds: s.seconds,
    })),
    volume: DEFAULT_PLAN.volume,
    autoAdvance: true,
    buzzerSound: 'scoreboard',
    bufferEnabled: false,
    bufferSeconds: 10,
  };
}

let saveTimer = null;
function saveState() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 1,
        segments: state.segments,
        volume: state.volume,
        autoAdvance: state.autoAdvance,
        buzzerSound: state.buzzerSound,
        bufferEnabled: state.bufferEnabled,
        bufferSeconds: state.bufferSeconds,
        lastModified: Date.now(),
      }));
    } catch (e) { console.warn('Save failed', e); }
  }, 200);
}

// ---------- FORMATTING ----------
function fmt(totalSec) {
  totalSec = Math.max(0, Math.ceil(totalSec));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function fmtTotal(totalSec) {
  totalSec = Math.max(0, Math.round(totalSec));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return h + 'h ' + (m < 10 ? '0' : '') + m + 'm';
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function parseDurationInput(str) {
  // Accept "mm:ss", "m:ss", "mm", "m" — return seconds or null
  str = String(str || '').trim();
  if (!str) return null;
  if (/^\d+$/.test(str)) return parseInt(str, 10) * 60;
  const m = str.match(/^(\d{1,3}):([0-5]?\d)$/);
  if (!m) return null;
  return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
}
function sumSeconds(segs) {
  return segs.reduce((a, s) => a + s.seconds, 0);
}

// Total wall-clock plan duration including inter-segment buffers if enabled.
function totalPlanDuration() {
  const segSum = state.segments.reduce((a, s) => a + s.seconds, 0);
  if (state.bufferEnabled && state.segments.length > 1) {
    return segSum + (state.segments.length - 1) * state.bufferSeconds;
  }
  return segSum;
}

function bufferSeconds() {
  return state.bufferEnabled ? state.bufferSeconds : 0;
}

// ---------- HTML5 AUDIO FALLBACK ----------
// iOS Safari's Web Audio API sometimes won't actually route audio to the
// speaker even when state === "running". HTMLAudioElement uses a different
// underlying audio session that's much more reliable on iOS. We generate a
// real scoreboard-buzzer WAV in JS at page load and keep an <audio> element
// primed so we can fire it from inside any user gesture as a fallback.

// Helper: build a mono 16-bit PCM WAV from a sample function.
// sampleFn(t, i, sampleRate, totalSamples) returns a float in [-1, 1].
function makeWav(durationSec, sampleRate, sampleFn) {
  const samples = Math.floor(durationSec * sampleRate);
  const bps = 2;
  const blockAlign = 1 * bps;
  const byteRate = sampleRate * blockAlign;
  const dataSize = samples * blockAlign;
  const buf = new ArrayBuffer(44 + dataSize);
  const v = new DataView(buf);
  function writeStr(off, s) { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); }
  writeStr(0, 'RIFF');     v.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE');     writeStr(12, 'fmt ');
  v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sampleRate, true);
  v.setUint32(28, byteRate, true);
  v.setUint16(32, blockAlign, true);
  v.setUint16(34, 16, true);
  writeStr(36, 'data');    v.setUint32(40, dataSize, true);
  for (let i = 0; i < samples; i++) {
    const t = i / sampleRate;
    let s = sampleFn(t, i, sampleRate, samples);
    if (s > 1) s = 1; else if (s < -1) s = -1;
    v.setInt16(44 + i * 2, Math.floor(s * 32767), true);
  }
  return buf;
}

// Scoreboard horn: two detuned naive sawtooths at ~165/169 Hz, gritty.
function generateBuzzWav(durationSec, sampleRate) {
  durationSec = durationSec || 2.0;
  sampleRate  = sampleRate  || 44100;
  const samples = Math.floor(durationSec * sampleRate);
  const fadeIn  = Math.floor(0.025 * sampleRate);
  const fadeOut = Math.floor(0.20  * sampleRate);
  return makeWav(durationSec, sampleRate, (t, i) => {
    let env = 1;
    if (i < fadeIn) env = i / fadeIn;
    else if (i > samples - fadeOut) env = (samples - i) / fadeOut;
    const ph1 = (t * 165) % 1;
    const ph2 = (t * 169) % 1;
    return ((2 * ph1 - 1) + (2 * ph2 - 1)) * 0.22 * env;
  });
}

// Boxing bell: sum of decaying sine partials over a 700 Hz fundamental.
// Inharmonic ratios (≈ 0.5, 1, 2, 3, 4.7, 6) give a real bell-like shimmer.
function generateBellWav(durationSec, sampleRate) {
  durationSec = durationSec || 2.5;
  sampleRate  = sampleRate  || 44100;
  const f0 = 700;
  const partials = [
    { r: 0.5, a: 0.35, τ: 0.7 },
    { r: 1.0, a: 1.00, τ: 0.55 },
    { r: 2.0, a: 0.55, τ: 0.40 },
    { r: 3.0, a: 0.30, τ: 0.32 },
    { r: 4.7, a: 0.22, τ: 0.26 },
    { r: 6.0, a: 0.14, τ: 0.20 },
  ];
  return makeWav(durationSec, sampleRate, (t) => {
    let s = 0;
    for (const p of partials) {
      s += Math.sin(2 * Math.PI * f0 * p.r * t) * p.a * Math.exp(-t / p.τ);
    }
    const fadeIn = 0.004;
    if (t < fadeIn) s *= t / fadeIn;
    return s * 0.30;
  });
}

// Whistle: high pure tone with vibrato. Phase-accumulated FM for clean sound.
function generateWhistleWav(durationSec, sampleRate) {
  durationSec = durationSec || 1.5;
  sampleRate  = sampleRate  || 44100;
  const f = 2500, vibFreq = 5.5, vibDepth = 28;
  let phase = 0;
  const dt = 1 / sampleRate;
  const fadeIn = 0.04, fadeOut = 0.12;
  return makeWav(durationSec, sampleRate, (t) => {
    const instFreq = f + Math.sin(2 * Math.PI * vibFreq * t) * vibDepth;
    phase += 2 * Math.PI * instFreq * dt;
    let s = Math.sin(phase);
    if (t < fadeIn) s *= t / fadeIn;
    else if (t > durationSec - fadeOut) s *= (durationSec - t) / fadeOut;
    return s * 0.40;
  });
}

// Air horn: two slightly-detuned square waves at low pitch. Honks.
function generateAirhornWav(durationSec, sampleRate) {
  durationSec = durationSec || 2.0;
  sampleRate  = sampleRate  || 44100;
  const f1 = 200, f2 = 207;
  const fadeIn = 0.015, fadeOut = 0.15;
  return makeWav(durationSec, sampleRate, (t) => {
    const sq1 = ((t * f1) % 1) < 0.5 ?  1 : -1;
    const sq2 = ((t * f2) % 1) < 0.5 ?  1 : -1;
    let s = (sq1 + sq2) * 0.18;
    if (t < fadeIn) s *= t / fadeIn;
    else if (t > durationSec - fadeOut) s *= (durationSec - t) / fadeOut;
    return s;
  });
}

// Single beep: clean 800 Hz sine, ~300 ms.
function generateBeepWav(durationSec, sampleRate) {
  durationSec = durationSec || 0.32;
  sampleRate  = sampleRate  || 44100;
  const f = 800;
  const fade = 0.015;
  return makeWav(durationSec, sampleRate, (t) => {
    let s = Math.sin(2 * Math.PI * f * t);
    if (t < fade) s *= t / fade;
    else if (t > durationSec - fade) s *= (durationSec - t) / fade;
    return s * 0.50;
  });
}

// Triple beep: three 150 ms beeps with 100 ms gaps, total ~0.85 s.
function generateTripleBeepWav(durationSec, sampleRate) {
  durationSec = durationSec || 0.85;
  sampleRate  = sampleRate  || 44100;
  const f = 900, beepDur = 0.15, gap = 0.10, period = beepDur + gap;
  const fade = 0.012;
  return makeWav(durationSec, sampleRate, (t) => {
    const beepIdx = Math.floor(t / period);
    if (beepIdx > 2) return 0;
    const local = t - beepIdx * period;
    if (local >= beepDur) return 0;
    let s = Math.sin(2 * Math.PI * f * t);
    if (local < fade) s *= local / fade;
    else if (local > beepDur - fade) s *= (beepDur - local) / fade;
    return s * 0.48;
  });
}

// Catalog of available buzzer sounds. URLs are lazily generated and cached.
// `dur` is the natural WAV duration in seconds — used by Buzzer.fire() to mute
// the looping buzz element after one full pass (otherwise short sounds like
// beep/triple would loop multiple times during the audible window).
const BuzzerSounds = {
  scoreboard: { label: 'Scoreboard buzzer', dur: 2.0,  gen: () => generateBuzzWav(2.0)        },
  bell:       { label: 'Boxing bell',       dur: 2.5,  gen: () => generateBellWav(2.5)        },
  airhorn:    { label: 'Air horn',          dur: 2.0,  gen: () => generateAirhornWav(2.0)     },
  whistle:    { label: 'Whistle',           dur: 1.5,  gen: () => generateWhistleWav(1.5)     },
  beep:       { label: 'Single beep',       dur: 0.32, gen: () => generateBeepWav(0.32)       },
  triple:     { label: 'Triple beep',       dur: 0.85, gen: () => generateTripleBeepWav(0.85) },
};
const _buzzerURLCache = Object.create(null);
function getBuzzerSoundURL(key) {
  if (!BuzzerSounds[key]) key = 'scoreboard';
  if (!_buzzerURLCache[key]) {
    const buf = BuzzerSounds[key].gen();
    _buzzerURLCache[key] = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  return _buzzerURLCache[key];
}

// Web Audio "silent keeper".
//
// iOS Safari treats Web Audio output as the *Ambient* audio session category
// by default — it mixes with other apps (Spotify, podcasts) instead of
// interrupting them, and it does NOT show up on the lock-screen Now Playing
// UI. We use this to keep the audio context's clock running (which helps
// keep JS alive on iOS) without stealing the audio session from background
// music.
//
// HTMLAudioElement, in contrast, takes the SoloAmbient/Playback category and
// always interrupts other audio + holds the Now Playing slot. So we only
// fire HTMLAudio for the brief moment the buzz is audible; outside of that
// window, audio is silent from our app's perspective and Spotify resumes.
// AudioCore: a single Web Audio context that hosts both the silent-keeper
// oscillator (keeps the graph alive) and the buzz playback (BufferSource
// nodes that mix with other apps' audio on iOS — Spotify, podcasts, etc.).
//
// Why Web Audio for the buzz instead of HTMLAudio:
// - HTMLAudio claims iOS' "SoloAmbient/Playback" category → interrupts other
//   apps. After our buzz pauses, iOS doesn't reliably fire the
//   "interruption ended" notification that Spotify needs to auto-resume.
// - Web Audio defaults to "Ambient" → mixes with other apps. Buzz plays
//   alongside the music; nothing pauses; no resume problem.
const AudioCore = (() => {
  let ctx = null;
  let osc = null;
  let gain = null;
  const decoded = new Map();   // soundKey → AudioBuffer

  function newCtx() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    return new Ctx();
  }

  // Must be called from a user gesture on iOS so resume() takes effect.
  function start() {
    if (!ctx || ctx.state === 'closed') {
      ctx = newCtx();
      if (!ctx) return;
      // Silent-keeper oscillator at near-zero gain. Keeps the graph "running"
      // so future BufferSource.start() calls work without scheduling drift.
      osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = 100;
      gain = ctx.createGain();
      gain.gain.value = 0.00001;       // ≈ -100 dB, inaudible
      osc.connect(gain).connect(ctx.destination);
      osc.start();
    }
    // CRUCIAL: a freshly-created AudioContext starts in 'suspended' state on
    // iOS — must always call resume() inside the gesture.
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  }

  function stop() {
    if (ctx && ctx.state !== 'closed') {
      try { ctx.close(); } catch (_) {}
    }
    ctx = null;
    osc = null;
    gain = null;
    decoded.clear();
  }

  // Lazily decode a sound's WAV into an AudioBuffer. Cached for reuse.
  async function decodeBuffer(soundKey) {
    if (decoded.has(soundKey)) return decoded.get(soundKey);
    if (!ctx) start();
    if (!ctx) return null;
    if (!BuzzerSounds[soundKey]) soundKey = 'scoreboard';
    const wavBuf = BuzzerSounds[soundKey].gen();
    const buffer = await ctx.decodeAudioData(wavBuf);
    decoded.set(soundKey, buffer);
    return buffer;
  }

  return {
    start, stop, decodeBuffer,
    getContext: () => ctx,
    getState:   () => ctx ? ctx.state : 'no-ctx',
  };
})();

// Buzzer: plays buzz sounds via Web Audio (BufferSource).
//
// Why Web Audio and not HTMLAudio? On iOS, Web Audio uses the *Ambient*
// audio session category — it mixes with whatever else is playing (Spotify,
// podcasts) rather than interrupting it. The previous HTMLAudio approach
// kept hitting iOS' inconsistent "should-resume-after-interruption" logic;
// Web Audio sidesteps the whole problem because nothing ever gets paused.
//
// Trade-off: the buzz plays *alongside* music rather than ducking it. The
// buzzer is short and at full user-volume, so it remains clearly audible.

const Buzzer = (() => {
  let active = false;
  let lastSource = null;        // current BufferSourceNode (so we can stop early)

  const tele = {
    lastFire: 0,
    keeperState: 'idle',
    buzzResult: 'idle',         // 'playing' | 'ended' | 'rejected' | 'idle'
    buzzError: '',
  };

  function start() {
    AudioCore.start();
    tele.keeperState = AudioCore.getState();
    active = true;
  }

  function fire(volume, oneShot) {
    tele.lastFire = Date.now();
    AudioCore.start();             // creates+resumes ctx if needed (gesture path)
    tele.keeperState = AudioCore.getState();
    active = true;
    tele.buzzError = '';

    const soundKey = state.buzzerSound || 'scoreboard';
    const ctx = AudioCore.getContext();
    if (!ctx) {
      tele.buzzResult = 'rejected';
      tele.buzzError = 'no audio context';
      return;
    }

    AudioCore.decodeBuffer(soundKey).then((buffer) => {
      if (!buffer) {
        tele.buzzResult = 'rejected';
        tele.buzzError = 'decode failed';
        return;
      }
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      const gain = ctx.createGain();
      gain.gain.value = Math.max(0, Math.min(1, volume));
      source.connect(gain).connect(ctx.destination);
      source.onended = () => {
        tele.buzzResult = 'ended';
        if (lastSource === source) lastSource = null;
        // For one-shot test buzzes, tear down AudioCore so the audio
        // graph isn't held open after the user's done.
        if (oneShot) stop();
      };
      lastSource = source;
      tele.buzzResult = 'playing';
      source.start();
    }).catch((e) => {
      tele.buzzResult = 'rejected';
      tele.buzzError = String(e && e.message || e);
      console.warn('[Mat Time] decodeBuffer/play failed:', e);
    });
  }

  function stop() {
    active = false;
    if (lastSource) {
      try { lastSource.stop(); } catch (_) {}
      lastSource = null;
    }
    AudioCore.stop();
    tele.keeperState = AudioCore.getState();
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.playbackState = 'none';
        navigator.mediaSession.metadata = null;
      } catch (_) {}
    }
  }

  // Sound selection is just a state mutation — buffers are decoded lazily
  // by AudioCore.decodeBuffer() on the next fire(). No play() side-effects
  // here, so the iOS <select>-change-gesture-quirk doesn't apply.
  function changeSound(soundKey) {
    // No-op at the audio layer; state.buzzerSound is the source of truth.
  }

  function isActive() { return active; }

  return { start, stop, fire, changeSound, isActive, telemetry: tele };
})();

// ---------- DIAGNOSTIC READOUT ----------
function renderDiag(label) {
  const el = document.getElementById('diag');
  if (!el) return;
  el.classList.remove('hidden');
  const bt = Buzzer.telemetry;
  const lines = [];
  lines.push('<div class="row"><strong>' + escapeHTML(label || 'Buzzer test') + '</strong><span>' + new Date().toLocaleTimeString() + '</span></div>');
  const soundKey = state.buzzerSound || 'scoreboard';
  const soundLabel = (BuzzerSounds[soundKey] && BuzzerSounds[soundKey].label) || soundKey;
  lines.push('<div class="row"><span>Sound</span><span>' + escapeHTML(soundLabel) + '</span></div>');
  const keeperOk = bt.keeperState === 'running';
  lines.push('<div class="row"><span>Audio keeper</span><span class="' + (keeperOk ? 'ok' : 'bad') + '">' +
             escapeHTML(bt.keeperState) + '</span></div>');
  const bOk = bt.buzzResult === 'playing' || bt.buzzResult === 'ended' || bt.buzzResult === 'paused';
  lines.push('<div class="row"><span>Buzz element</span><span class="' + (bOk ? 'ok' : 'bad') + '">' +
             escapeHTML(bt.buzzResult) + (bt.buzzError ? ' · ' + escapeHTML(String(bt.buzzError)) : '') + '</span></div>');
  lines.push('<div class="row"><span>Volume</span><span>' + Math.round(state.volume * 100) + '%</span></div>');
  lines.push('<div class="row"><span>UA</span><span>' + escapeHTML(navigator.userAgent.replace(/^Mozilla\/5\.0 \(/, '').slice(0, 60)) + '…</span></div>');
  el.innerHTML = lines.join('');
}

// ---------- TIMER ENGINE ----------
//
// Audio strategy: all buzzes flow through Buzzer (HTMLAudio elements) which
// is the only path that reliably works across desktop + iOS, including with
// the screen locked. We used to fire Web Audio in parallel as a "desktop
// fallback", but that played the hardcoded scoreboard synth on top of the
// user-selected HTMLAudio sound — so it's gone.
const Timer = {
  buzzTimeouts: [],        // setTimeout IDs for HTMLAudio buzz playback
  wakeLock: null,
  state: 'idle',           // 'idle' | 'running' | 'paused' | 'finished'
  anchorMs: 0,             // performance.now() at the virtual plan start
  currentIndex: 0,         // index into state.segments — segment we're in or upcoming
  elapsedInSegment: 0,     // seconds elapsed in the current phase (segment OR buffer)
  inBuffer: false,         // true when paused/running in the buffer BEFORE currentIndex
  rafHandle: null,

  setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: state.segments[this.currentIndex]?.name || 'Mat Time',
        artist: 'Mat Time',
        album: 'BJJ Class',
      });
      navigator.mediaSession.setActionHandler('play', () => this.play());
      navigator.mediaSession.setActionHandler('pause', () => this.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => this.prev());
      navigator.mediaSession.setActionHandler('nexttrack', () => this.next());
      navigator.mediaSession.playbackState = this.state === 'running' ? 'playing' : 'paused';
    } catch (_) {}
  },

  async requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      this.wakeLock = await navigator.wakeLock.request('screen');
      this.wakeLock.addEventListener('release', () => { this.wakeLock = null; });
    } catch (_) {}
  },

  releaseWakeLock() {
    if (this.wakeLock) {
      try { this.wakeLock.release(); } catch (_) {}
      this.wakeLock = null;
    }
  },

  play() {
    if (this.state === 'running') return;
    // Synchronous within the gesture, for iOS audio unlock.
    Buzzer.start();                   // keeps iOS session + buzz element alive

    const beforeMs = (this.cumBefore(this.currentIndex, this.inBuffer) + this.elapsedInSegment) * 1000;
    this.anchorMs = performance.now() - beforeMs;

    this.scheduleAllBuzzesTimeouts();

    this.state = 'running';
    this.requestWakeLock();
    this.setupMediaSession();
    this.startDisplayLoop();
    render();
  },

  pause() {
    if (this.state !== 'running') return;
    const elapsedTotal = (performance.now() - this.anchorMs) / 1000;
    const loc = this.locateAt(elapsedTotal);
    this.currentIndex = loc.index;
    this.elapsedInSegment = loc.elapsedInSeg;
    this.inBuffer = loc.inBuffer;
    this.clearBuzzTimeouts();
    this.releaseWakeLock();
    Buzzer.stop();
    this.state = 'paused';
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    cancelAnimationFrame(this.rafHandle);
    render();
  },

  togglePlay() {
    if (this.state === 'running') this.pause();
    else this.play();
  },

  prev() {
    // If more than 2s into current, restart current; else jump to previous segment.
    const elapsed = this.elapsedInSegmentNow();
    if (elapsed > 2 || this.currentIndex === 0) {
      this.jumpTo(this.currentIndex);
    } else {
      this.jumpTo(this.currentIndex - 1);
    }
  },

  next() {
    if (this.currentIndex + 1 < state.segments.length) {
      this.jumpTo(this.currentIndex + 1);
    } else {
      // At last segment — just finish it
      this.jumpTo(this.currentIndex);
      this.elapsedInSegment = state.segments[this.currentIndex].seconds;
      if (this.state === 'running') this.reschedule();
      render();
    }
  },

  jumpTo(index) {
    index = Math.max(0, Math.min(state.segments.length - 1, index));
    this.currentIndex = index;
    this.elapsedInSegment = 0;
    this.inBuffer = false;       // tapping a segment skips any preceding buffer
    if (this.state === 'running') this.reschedule();
    if (this.state === 'finished') this.state = 'paused';
    render();
  },

  reschedule() {
    const beforeMs = (this.cumBefore(this.currentIndex, this.inBuffer) + this.elapsedInSegment) * 1000;
    this.anchorMs = performance.now() - beforeMs;
    this.scheduleAllBuzzesTimeouts();
  },

  // Called when the plan structure changes (edits, adds, deletes, reorders,
  // or the buffer toggle flips).
  onPlanChanged() {
    if (this.currentIndex >= state.segments.length) {
      this.currentIndex = Math.max(0, state.segments.length - 1);
      this.elapsedInSegment = 0;
      this.inBuffer = false;
    }
    if (this.state === 'running') this.reschedule();
    render();
  },

  elapsedInSegmentNow() {
    if (this.state !== 'running') return this.elapsedInSegment;
    const elapsedTotal = (performance.now() - this.anchorMs) / 1000;
    const loc = this.locateAt(elapsedTotal);
    return loc.elapsedInSeg;
  },

  // Wall-clock time from anchor to the START of segment[idx]
  // (or the buffer before it if inBuf is true).
  cumBefore(idx, inBuf) {
    const buf = bufferSeconds();
    let c = 0;
    for (let i = 0; i < idx && i < state.segments.length; i++) {
      c += state.segments[i].seconds;
      if (i < state.segments.length - 1) c += buf;
    }
    if (inBuf) c -= buf;  // start of the buffer is one buffer-length before the segment
    return c;
  },

  // Locate the playhead at elapsedTotal seconds from anchor.
  // Returns { inBuffer, index, elapsedInSeg, past }.
  // - inBuffer=false: in segment[index], elapsedInSeg = time into that segment
  // - inBuffer=true:  in the buffer BEFORE segment[index], elapsedInSeg = time into buffer
  locateAt(elapsedTotal) {
    if (elapsedTotal < 0) elapsedTotal = 0;
    const buf = bufferSeconds();
    let cum = 0;
    for (let i = 0; i < state.segments.length; i++) {
      const segLen = state.segments[i].seconds;
      if (elapsedTotal < cum + segLen) {
        return { inBuffer: false, index: i, elapsedInSeg: elapsedTotal - cum, past: false };
      }
      cum += segLen;
      if (buf > 0 && i < state.segments.length - 1) {
        if (elapsedTotal < cum + buf) {
          return { inBuffer: true, index: i + 1, elapsedInSeg: elapsedTotal - cum, past: false };
        }
        cum += buf;
      }
    }
    return { inBuffer: false, index: state.segments.length - 1, elapsedInSeg: state.segments[state.segments.length - 1].seconds, past: true };
  },

  // Schedule setTimeout-driven phase-end events. Each event fires the
  // HTMLAudio buzz (audible everywhere) and runs the auto/manual-advance
  // logic. setTimeout fires reliably on iOS while the Buzzer silent loop
  // is playing in the background.
  scheduleAllBuzzesTimeouts() {
    this.clearBuzzTimeouts();
    const segs = state.segments;
    const buf = bufferSeconds();
    const nowMs = performance.now();
    let cum = 0;
    for (let i = 0; i < segs.length; i++) {
      cum += segs[i].seconds;
      const fireSeg = this.anchorMs + cum * 1000;
      const delaySeg = fireSeg - nowMs;
      if (delaySeg > 30) {
        const idx = i;
        this.buzzTimeouts.push(setTimeout(() => this.onPhaseEnd('segment', idx), delaySeg));
      }
      if (buf > 0 && i < segs.length - 1) {
        cum += buf;
        const fireBuf = this.anchorMs + cum * 1000;
        const delayBuf = fireBuf - nowMs;
        if (delayBuf > 30) {
          const idx = i;
          this.buzzTimeouts.push(setTimeout(() => this.onPhaseEnd('buffer', idx), delayBuf));
        }
      }
    }
  },

  clearBuzzTimeouts() {
    for (const id of this.buzzTimeouts) clearTimeout(id);
    this.buzzTimeouts = [];
  },

  // Fires when a phase (segment or buffer) ends. Plays the audible buzz and
  // decides what comes next based on phase + buffer/manual-advance settings.
  //
  // phase='segment', idx=N: segment N just ended
  //   - if buffer enabled (and not last): display loop will enter the buffer
  //     phase naturally; don't pause
  //   - if buffer disabled and manual mode: pause at start of segment N+1
  //   - else: display loop rolls over to segment N+1
  //
  // phase='buffer', idx=N: the buffer between segment N and N+1 just ended
  //   - if manual mode: pause at start of segment N+1
  //   - else: display loop rolls over into segment N+1
  onPhaseEnd(phase, idx) {
    Buzzer.fire(state.volume);

    const lastSeg = state.segments.length - 1;

    if (phase === 'segment') {
      if (idx >= lastSeg) return;        // final buzz; display loop will finish()
      if (state.bufferEnabled) return;   // buffer phase coming up; display loop handles it
      if (state.autoAdvance !== false) return;  // auto-advance: roll over naturally
      this._pauseAtSegment(idx + 1);
      return;
    }

    if (phase === 'buffer') {
      // Buffer ended → segment idx+1 starts now
      if (state.autoAdvance !== false) return;  // roll over naturally
      this._pauseAtSegment(idx + 1);
      return;
    }
  },

  _pauseAtSegment(nextIdx) {
    this.clearBuzzTimeouts();
    this.releaseWakeLock();
    cancelAnimationFrame(this.rafHandle);
    Buzzer.stop();
    this.state = 'paused';
    this.currentIndex = nextIdx;
    this.elapsedInSegment = 0;
    this.inBuffer = false;
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.playbackState = 'paused'; } catch (_) {}
    }
    render();
    flashToast('Ready: "' + state.segments[nextIdx].name + '" · tap ▶');
  },

  // Tap-the-speaker test. Fires a single buzz of the currently-selected
  // sound. Must be invoked synchronously inside a user-gesture handler on
  // iOS (the speaker button click qualifies).
  //
  // Passes oneShot=true when no class is running, so the audio session is
  // fully released after the buzz finishes and background music resumes.
  // During an active class run, we leave the AudioCore context alive so
  // future setTimeout-driven buzzes can decode + play without re-priming.
  testBuzz() {
    try {
      const oneShot = this.state !== 'running';
      Buzzer.fire(state.volume, oneShot);
      console.log('[Mat Time] test buzz fired · vol=' + state.volume +
                  ' · sound=' + (state.buzzerSound || 'scoreboard') +
                  ' · oneShot=' + oneShot);
      return true;
    } catch (e) {
      console.error('[Mat Time] testBuzz failed:', e);
      return false;
    }
  },

  startDisplayLoop() {
    const tick = () => {
      if (this.state !== 'running') return;
      this.updateDisplay();
      this.rafHandle = requestAnimationFrame(tick);
    };
    this.rafHandle = requestAnimationFrame(tick);
  },

  updateDisplay() {
    const elapsedTotal = (performance.now() - this.anchorMs) / 1000;
    const total = totalPlanDuration();
    if (elapsedTotal >= total) {
      this.finish();
      return;
    }
    const loc = this.locateAt(elapsedTotal);
    // Detect phase change (segment ↔ buffer, or new segment) — update the
    // big segment-name label + next-up + media session.
    if (loc.index !== this.currentIndex || loc.inBuffer !== this.inBuffer) {
      this.currentIndex = loc.index;
      this.inBuffer = loc.inBuffer;
      this.elapsedInSegment = loc.elapsedInSeg;
      const seg = state.segments[this.currentIndex];
      const timerCard = $('timerCard');
      timerCard.classList.toggle('in-buffer', loc.inBuffer);
      if (loc.inBuffer) {
        $('curName').textContent = 'Break · before ' + (seg ? seg.name : '');
        $('timerLabel').textContent = 'Break';
        $('nextUp').innerHTML = seg ? 'Starting · <strong>' + escapeHTML(seg.name) + '</strong>' : '';
      } else {
        $('curName').textContent = seg ? seg.name : '';
        $('timerLabel').textContent = 'Now';
        const nextSeg = state.segments[this.currentIndex + 1];
        if (nextSeg) {
          $('nextUp').innerHTML = 'Up next · <strong>' + escapeHTML(nextSeg.name) + '</strong>';
        } else {
          $('nextUp').innerHTML = '<em style="color:var(--muted)">Last segment</em>';
        }
      }
      if ('mediaSession' in navigator && navigator.mediaSession.metadata) {
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: loc.inBuffer ? ('Break · before ' + (seg ? seg.name : '')) : (seg ? seg.name : 'Mat Time'),
            artist: 'Mat Time',
            album: 'BJJ Class',
          });
        } catch (_) {}
      }
      renderRowsHighlight();
    }
    renderTimerOnly(elapsedTotal, loc);
  },

  finish() {
    this.state = 'finished';
    this.currentIndex = state.segments.length - 1;
    this.elapsedInSegment = state.segments[this.currentIndex].seconds;
    this.inBuffer = false;
    this.clearBuzzTimeouts();
    this.releaseWakeLock();
    Buzzer.stop();
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    cancelAnimationFrame(this.rafHandle);
    $('timerCard').classList.remove('in-buffer');
    render();
  },

  reset() {
    this.clearBuzzTimeouts();
    this.releaseWakeLock();
    Buzzer.stop();
    cancelAnimationFrame(this.rafHandle);
    this.state = 'idle';
    this.currentIndex = 0;
    this.elapsedInSegment = 0;
    this.inBuffer = false;
    $('timerCard').classList.remove('in-buffer');
    render();
  },
};

// ---------- RENDER ----------
const $ = (id) => document.getElementById(id);

function renderTimerOnly(elapsedTotal, loc) {
  const inBuf = loc ? loc.inBuffer : Timer.inBuffer;
  const elapsedInPhase = loc ? loc.elapsedInSeg : Timer.elapsedInSegment;
  let remaining;
  if (inBuf) {
    remaining = Math.max(0, state.bufferSeconds - elapsedInPhase);
  } else {
    const seg = state.segments[Timer.currentIndex];
    if (!seg) return;
    remaining = Math.max(0, seg.seconds - elapsedInPhase);
  }
  $('countdown').textContent = fmt(remaining);
  const total = totalPlanDuration();
  const totalElapsed = elapsedTotal != null
    ? elapsedTotal
    : (Timer.cumBefore(Timer.currentIndex, Timer.inBuffer) + Timer.elapsedInSegment);
  $('totals').textContent = fmtTotal(Math.min(totalElapsed, total)) + ' / ' + fmtTotal(total);
}

function renderTimerCard() {
  const seg = state.segments[Timer.currentIndex];
  if (!seg) {
    $('curName').textContent = '—';
    $('countdown').textContent = '00:00';
    $('nextUp').innerHTML = '&nbsp;';
    $('totals').textContent = '0:00 / 0:00';
    return;
  }
  const inBuf = Timer.inBuffer;
  $('timerCard').classList.toggle('in-buffer', inBuf && Timer.state !== 'finished');

  if (inBuf) {
    $('curName').textContent = 'Break · before ' + seg.name;
    const remaining = Math.max(0, state.bufferSeconds - Timer.elapsedInSegment);
    $('countdown').textContent = fmt(remaining);
  } else {
    $('curName').textContent = seg.name;
    const remaining = Math.max(0, seg.seconds - Timer.elapsedInSegment);
    $('countdown').textContent = fmt(remaining);
  }

  // Label
  if (Timer.state === 'finished') $('timerLabel').textContent = 'Class complete';
  else if (Timer.state === 'running') $('timerLabel').textContent = inBuf ? 'Break' : 'Now';
  else if (Timer.state === 'paused') $('timerLabel').textContent = inBuf ? 'Break · paused' : 'Paused';
  else $('timerLabel').textContent = 'Ready';

  $('timerCard').classList.toggle('finished', Timer.state === 'finished');

  // Next up
  const nextSeg = state.segments[Timer.currentIndex + 1];
  if (Timer.state === 'finished') {
    $('nextUp').textContent = 'Tap reset or pick a segment to start again';
  } else if (inBuf) {
    $('nextUp').innerHTML = 'Starting · <strong>' + escapeHTML(seg.name) + '</strong>';
  } else if (nextSeg) {
    $('nextUp').innerHTML = 'Up next · <strong>' + escapeHTML(nextSeg.name) + '</strong>';
  } else {
    $('nextUp').innerHTML = '<em style="color:var(--muted)">Last segment</em>';
  }

  // Totals (include buffer time in total when enabled)
  const total = totalPlanDuration();
  const totalElapsed = Timer.cumBefore(Timer.currentIndex, Timer.inBuffer) + Timer.elapsedInSegment;
  $('totals').textContent = fmtTotal(Math.min(totalElapsed, total)) + ' / ' + fmtTotal(total);

  // Play icon
  const playIcon = $('playIcon');
  if (Timer.state === 'running') {
    // Pause icon
    playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    $('playBtn').setAttribute('aria-label', 'Pause');
  } else {
    // Play icon
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    $('playBtn').setAttribute('aria-label', 'Play');
  }
}

function renderRowsHighlight() {
  const rows = document.querySelectorAll('.seg-row');
  rows.forEach((row, i) => {
    row.classList.toggle('current', i === Timer.currentIndex && Timer.state !== 'finished');
    row.classList.toggle('completed', i < Timer.currentIndex);
  });
}

function renderPlanList() {
  const ol = $('segList');
  ol.innerHTML = '';
  state.segments.forEach((seg, i) => {
    const li = document.createElement('li');
    li.className = 'seg-row';
    if (i === Timer.currentIndex && Timer.state !== 'finished') li.classList.add('current');
    if (i < Timer.currentIndex) li.classList.add('completed');
    if (/rest/i.test(seg.name)) li.dataset.rest = 'true';
    li.dataset.id = seg.id;
    li.dataset.index = i;

    li.innerHTML = [
      '<div class="seg-handle" data-handle>≡</div>',
      '<input class="seg-name-input" type="text" value="', escapeAttr(seg.name), '" data-role="name" enterkeyhint="done" autocomplete="off" autocapitalize="sentences" spellcheck="false">',
      '<input class="seg-duration-input" type="text" value="', fmt(seg.seconds), '" data-role="dur" inputmode="numeric" enterkeyhint="done" autocomplete="off">',
      '<button type="button" class="seg-dup" data-role="dup" aria-label="Duplicate segment">',
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">',
          '<rect x="9" y="9" width="13" height="13" rx="2"></rect>',
          '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
        '</svg>',
      '</button>',
      '<button type="button" class="seg-delete" data-role="del" aria-label="Delete segment">×</button>',
    ].join('');

    ol.appendChild(li);
  });
  $('planTotal').textContent = fmtTotal(totalPlanDuration())
    + (state.bufferEnabled && state.segments.length > 1
       ? ' · incl ' + state.bufferSeconds + 's breaks'
       : '');
}

function render() {
  renderPlanList();
  renderTimerCard();
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHTML(s); }

// ---------- EVENT BINDINGS ----------
$('playBtn').addEventListener('click', () => Timer.togglePlay());
$('prevBtn').addEventListener('click', () => Timer.prev());
$('nextBtn').addEventListener('click', () => Timer.next());

// Long-press countdown to reset current segment
let lpTimer = null;
const cd = $('countdown');
const startLP = (e) => {
  lpTimer = setTimeout(() => {
    // Reset current segment
    Timer.elapsedInSegment = 0;
    if (Timer.state === 'running') Timer.reschedule();
    render();
    flashToast('Segment reset');
  }, 700);
};
const cancelLP = () => { clearTimeout(lpTimer); lpTimer = null; };
cd.addEventListener('pointerdown', startLP);
cd.addEventListener('pointerup', cancelLP);
cd.addEventListener('pointerleave', cancelLP);
cd.addEventListener('pointercancel', cancelLP);

// Add segment to bottom
$('addBtn').addEventListener('click', () => {
  state.segments.push({
    id: crypto.randomUUID(),
    name: 'New segment',
    seconds: 60,
  });
  saveState();
  Timer.onPlanChanged();
});

// Add segment to top — shift currentIndex so the active segment stays the same
$('addTopBtn').addEventListener('click', () => {
  state.segments.unshift({
    id: crypto.randomUUID(),
    name: 'New segment',
    seconds: 60,
  });
  // Anything past the new index 0 shifts down by one.
  if (Timer.state !== 'idle' || Timer.currentIndex > 0 || Timer.elapsedInSegment > 0) {
    Timer.currentIndex += 1;
  }
  saveState();
  Timer.onPlanChanged();
});

// Duplicate a segment in place (inserts a copy right after it)
function duplicateSegment(idx) {
  if (idx < 0 || idx >= state.segments.length) return;
  const orig = state.segments[idx];
  const copy = {
    id: crypto.randomUUID(),
    name: orig.name,
    seconds: orig.seconds,
  };
  state.segments.splice(idx + 1, 0, copy);
  // If currentIndex is past the duplication point, shift it.
  if (Timer.currentIndex > idx) Timer.currentIndex += 1;
  saveState();
  Timer.onPlanChanged();
  flashToast('Duplicated "' + orig.name + '"');
}

// Reset to default
$('resetBtn').addEventListener('click', () => {
  if (!confirm('Replace the current plan with the default 90-min closed-guard passing class?')) return;
  Object.assign(state, cloneDefault());
  Timer.reset();
  saveState();
  Timer.onPlanChanged();
});

// Auto-advance toggle
const advanceToggle = $('advanceToggle');
const advanceLabel = $('advanceLabel');
function renderAdvanceToggle() {
  const on = state.autoAdvance !== false;
  advanceToggle.dataset.on = on ? 'true' : 'false';
  advanceLabel.textContent = on ? 'Auto-advance' : 'Manual · tap ▶ after buzzer';
}
renderAdvanceToggle();
advanceToggle.addEventListener('click', () => {
  state.autoAdvance = !(state.autoAdvance !== false);
  renderAdvanceToggle();
  saveState();
  // If the timer is currently running, no need to reschedule — the
  // setTimeout-driven onPhaseEnd reads state.autoAdvance at fire time.
  flashToast(state.autoAdvance ? 'Auto-advance ON' : 'Manual mode — timer will pause at each buzzer');
});

// Inter-segment buffer toggle
const bufferToggle = $('bufferToggle');
const bufferLabel  = $('bufferLabel');
function renderBufferToggle() {
  const on = state.bufferEnabled === true;
  bufferToggle.dataset.on = on ? 'true' : 'false';
  bufferLabel.textContent = on ? state.bufferSeconds + 's break ON' : '+' + state.bufferSeconds + 's break';
}
renderBufferToggle();
bufferToggle.addEventListener('click', () => {
  state.bufferEnabled = !state.bufferEnabled;
  renderBufferToggle();
  saveState();
  // The timer engine reads state.bufferEnabled when scheduling and locating.
  // If running, reschedule with the new shape — onPlanChanged handles that.
  Timer.onPlanChanged();
  flashToast(state.bufferEnabled
    ? state.bufferSeconds + 's break between segments'
    : 'No break between segments');
});

// Volume
const vs = $('volSlider');
vs.value = String(Math.round(state.volume * 100));
vs.addEventListener('input', () => {
  state.volume = Math.max(0, Math.min(1, vs.valueAsNumber / 100));
  // Volume is read by Buzzer.fire() at the moment of playback; no audio
  // element to update here.
  saveState();
});

// Buzzer sound selector
const soundSelect = $('soundSelect');
if (state.buzzerSound && BuzzerSounds[state.buzzerSound]) {
  soundSelect.value = state.buzzerSound;
} else {
  state.buzzerSound = 'scoreboard';
  soundSelect.value = 'scoreboard';
}
soundSelect.addEventListener('change', () => {
  const key = soundSelect.value;
  if (!BuzzerSounds[key]) return;
  state.buzzerSound = key;
  saveState();
  // iOS quirk: the change event fired after the wheel picker closes is
  // NOT treated as a fresh user gesture, so play() would be rejected
  // (and worse, would leave the audio elements paused). Don't attempt to
  // preview here. changeSound just records the choice; the next real-
  // button gesture (test buzzer or Play) will switch + play in valid
  // gesture context.
  Buzzer.changeSound(key);
  flashToast('Buzzer: ' + BuzzerSounds[key].label + ' · tap the speaker to preview');
});
// Tap the speaker icon button to test the buzzer.
// Crucial: do NOT await anything before calling Timer.testBuzz() — on iOS, the
// audio-context unlock must happen in the synchronous call stack of the user
// gesture, and awaits push the rest of the function into a microtask that no
// longer counts as gesture-initiated.
const testBuzzBtn = document.getElementById('testBuzzBtn');
testBuzzBtn.addEventListener('click', () => {
  const ok = Timer.testBuzz();
  testBuzzBtn.classList.add('flash');
  setTimeout(() => testBuzzBtn.classList.remove('flash'), 250);
  // Show the diagnostic readout — slight delay so HTMLAudio has time to
  // resolve its play() promise and update its telemetry.
  setTimeout(() => renderDiag('Test buzzer'), 250);
  if (!ok) flashToast('Buzzer test failed — check diagnostic');
});

// Delegate list events: name edit, duration edit, delete, jump
$('segList').addEventListener('change', (e) => {
  const row = e.target.closest('.seg-row');
  if (!row) return;
  const idx = parseInt(row.dataset.index, 10);
  if (e.target.dataset.role === 'name') {
    const v = e.target.value.trim() || 'Segment';
    state.segments[idx].name = v;
    saveState();
    Timer.onPlanChanged();
  } else if (e.target.dataset.role === 'dur') {
    const secs = parseDurationInput(e.target.value);
    if (secs === null || secs < 1) {
      e.target.value = fmt(state.segments[idx].seconds);
      flashToast('Use mm:ss or whole minutes');
      return;
    }
    state.segments[idx].seconds = secs;
    saveState();
    Timer.onPlanChanged();
  }
});
$('segList').addEventListener('click', (e) => {
  const row = e.target.closest('.seg-row');
  if (!row) return;
  const idx = parseInt(row.dataset.index, 10);
  // The click target may be a child of the action button (e.g. SVG inside
  // the duplicate button). Walk up to find the [data-role] owner.
  const actor = e.target.closest('[data-role]');
  const role = actor && actor.dataset.role;
  if (role === 'del') softDelete(idx);
  else if (role === 'dup') duplicateSegment(idx);
});
// Tap segment name / row whitespace → jump timer to that segment
$('segList').addEventListener('dblclick', (e) => {
  const row = e.target.closest('.seg-row');
  if (!row) return;
  if (e.target.classList.contains('seg-handle')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  const idx = parseInt(row.dataset.index, 10);
  Timer.jumpTo(idx);
});

// Select all on focus, for fast editing
$('segList').addEventListener('focusin', (e) => {
  if (e.target.tagName === 'INPUT') {
    setTimeout(() => e.target.select && e.target.select(), 10);
  }
});

// ---------- SOFT DELETE WITH UNDO ----------
let pendingDelete = null;
let toastTimer = null;
function softDelete(idx) {
  if (state.segments.length <= 1) {
    flashToast("Can't delete the last segment");
    return;
  }
  pendingDelete = { index: idx, segment: state.segments[idx] };
  state.segments.splice(idx, 1);
  saveState();
  Timer.onPlanChanged();
  showUndo('Deleted "' + pendingDelete.segment.name + '"');
}
function showUndo(msg) {
  $('toastMsg').textContent = msg;
  $('toast').classList.remove('hidden');
  $('toastUndo').style.display = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    $('toast').classList.add('hidden');
    pendingDelete = null;
  }, 5000);
}
$('toastUndo').addEventListener('click', () => {
  if (!pendingDelete) return;
  state.segments.splice(pendingDelete.index, 0, pendingDelete.segment);
  pendingDelete = null;
  $('toast').classList.add('hidden');
  saveState();
  Timer.onPlanChanged();
});
function flashToast(msg) {
  $('toastMsg').textContent = msg;
  $('toast').classList.remove('hidden');
  $('toastUndo').style.display = 'none';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    $('toast').classList.add('hidden');
    $('toastUndo').style.display = '';
  }, 1800);
}

// ---------- DRAG TO REORDER (pointer events; works on touch + mouse) ----------
let drag = null;
$('segList').addEventListener('pointerdown', (e) => {
  if (!e.target.matches('[data-handle]')) return;
  const row = e.target.closest('.seg-row');
  if (!row) return;
  e.preventDefault();
  const rect = row.getBoundingClientRect();
  drag = {
    fromIndex: parseInt(row.dataset.index, 10),
    row,
    offsetY: e.clientY - rect.top,
    startY: e.clientY,
    pointerId: e.pointerId,
    moved: false,
  };
  row.classList.add('dragging');
  try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (Math.abs(e.clientY - drag.startY) > 4) drag.moved = true;
  // Find which row we're hovering — simple: iterate rows
  const rows = Array.from(document.querySelectorAll('.seg-row'));
  let target = null;
  for (const r of rows) {
    if (r === drag.row) continue;
    const rect = r.getBoundingClientRect();
    if (e.clientY >= rect.top && e.clientY <= rect.bottom) { target = r; break; }
  }
  if (target) {
    const targetIdx = parseInt(target.dataset.index, 10);
    const fromIdx = parseInt(drag.row.dataset.index, 10);
    if (targetIdx !== fromIdx) {
      // Reorder DOM
      if (targetIdx > fromIdx) target.after(drag.row);
      else target.before(drag.row);
      // Update data-index on all rows
      document.querySelectorAll('.seg-row').forEach((r, i) => r.dataset.index = String(i));
    }
  }
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const newOrder = Array.from(document.querySelectorAll('.seg-row')).map(r => r.dataset.id);
  // Rebuild state.segments in new order
  const byId = new Map(state.segments.map(s => [s.id, s]));
  state.segments = newOrder.map(id => byId.get(id)).filter(Boolean);
  drag.row.classList.remove('dragging');
  drag = null;
  saveState();
  Timer.onPlanChanged();
});
document.addEventListener('pointercancel', () => {
  if (!drag) return;
  drag.row.classList.remove('dragging');
  drag = null;
  render();
});

// ---------- VISIBILITY: re-sync when returning to tab ----------
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Timer.state === 'running') {
    Timer.updateDisplay();
    Timer.requestWakeLock(); // re-acquire if lost during background
  }
});

// ---------- SERVICE WORKER ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ---------- SCROLL COLLAPSE FOR TIMER CARD ----------
// When the user scrolls down past ~80px, shrink the sticky timer card so
// more of the plan editor is visible. Snaps back to full size near the top.
(() => {
  const timerCard = $('timerCard');
  let minimized = false;
  let raf = null;
  function update() {
    raf = null;
    const y = window.scrollY || window.pageYOffset || 0;
    if (!minimized && y > 80) {
      timerCard.classList.add('minimized');
      minimized = true;
    } else if (minimized && y < 30) {
      timerCard.classList.remove('minimized');
      minimized = false;
    }
  }
  window.addEventListener('scroll', () => {
    if (raf === null) raf = requestAnimationFrame(update);
  }, { passive: true });
})();

// ---------- INITIAL RENDER ----------
render();

// Save once on first load so a fresh user has a stored plan
saveState();

</script>
</body>
</html>
